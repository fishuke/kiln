apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: kiln-data, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: kiln-api, labels: {{- include "kiln.labels" . | nindent 4 }} }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kiln-api, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: kiln-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kiln-api } }
    spec:
      serviceAccountName: kiln-api
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: api
          image: {{ .Values.image.api }}
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env:
            - { name: KILN_PUBLIC_URL, value: {{ .Values.publicUrl | quote }} }
            - { name: KILN_WEB_URL, value: {{ .Values.webUrl | quote }} }
            - { name: KILN_SANDBOX, value: kubernetes }
            - { name: KILN_SANDBOX_NAMESPACE, value: {{ .Values.sandboxes.namespace }} }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 4000 }, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
      volumes: [{ name: data, persistentVolumeClaim: { claimName: kiln-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: kiln-api, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  selector: { app.kubernetes.io/name: kiln-api }
  ports: [{ port: 4000, targetPort: 4000 }]
