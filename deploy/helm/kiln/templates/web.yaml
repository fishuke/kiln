apiVersion: apps/v1
kind: Deployment
metadata: { name: kiln-web, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: kiln-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kiln-web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: web
          image: {{ .Values.image.web }}
          ports: [{ containerPort: 3000 }]
          env:
            - { name: KILN_API_URL, value: "http://kiln-api:4000" }
            - name: KILN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: KILN_TOKEN } }
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: kiln-web, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  selector: { app.kubernetes.io/name: kiln-web }
  ports: [{ port: 3000, targetPort: 3000 }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: kiln, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: [{{ .Values.ingress.host }}], secretName: kiln-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: kiln-api, port: { number: 4000 } } } }
          - { path: /mcp, pathType: Prefix, backend: { service: { name: kiln-api, port: { number: 4000 } } } }
          - { path: /webhooks, pathType: Prefix, backend: { service: { name: kiln-api, port: { number: 4000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: kiln-web, port: { number: 3000 } } } }
{{- end }}
{{- if and .Values.ingress.enabled .Values.studio.previewDomain }}
---
# Studio previews: every <id>.<previewDomain> goes to the API, which proxies it (and its HMR websocket) to the sandbox.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: kiln-preview, labels: {{- include "kiln.labels" . | nindent 4 }} }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: ["*.{{ .Values.studio.previewDomain }}"], secretName: {{ .Values.studio.previewTlsSecret }} }]
  {{- end }}
  rules:
    - host: "*.{{ .Values.studio.previewDomain }}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: kiln-api, port: { number: 4000 } } } }
{{- end }}
