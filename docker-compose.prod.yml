# Kiln for a server: Coolify, or any Docker host. See docs/site/infrastructure/self-hosting.md.
# Coolify: add a "Docker Compose" resource from this repo with this file, give `web` and `api`
# their domains, and fill in the variables it lists. Elsewhere: copy .env.example to .env and run
#   docker compose -f docker-compose.prod.yml --profile proxy up -d --build
name: kiln
services:
  api:
    build: .
    # A real init process forwards stop signals, so the container stops in a second instead of Docker's 10s timeout.
    init: true
    restart: unless-stopped
    environment:
      KILN_PUBLIC_URL: ${KILN_PUBLIC_URL:?the API's public URL, e.g. https://api.kiln.example.com}
      KILN_WEB_URL: ${KILN_WEB_URL:?the web app's public URL, e.g. https://kiln.example.com}
      KILN_OWNER_EMAIL: ${KILN_OWNER_EMAIL:?your email, the only one that can create the first account}
      KILN_SECRET_KEY: ${KILN_SECRET_KEY:?a long random value, e.g. openssl rand -hex 32}
      # Rotating KILN_SECRET_KEY: set the old value here for one deploy; stored secrets are resealed with the new key.
      KILN_SECRET_KEY_PREVIOUS: ${KILN_SECRET_KEY_PREVIOUS:-}
      KILN_ADMIN_EMAILS: ${KILN_ADMIN_EMAILS:-}
      KILN_OPEN_SIGNUP: ${KILN_OPEN_SIGNUP:-0}
      KILN_DEMO: ${KILN_DEMO:-0}
      KILN_AGENTS: ${KILN_AGENTS:-real}
      KILN_SANDBOX: ${KILN_SANDBOX:-docker}
      KILN_RUNNER_IMAGE: ${KILN_RUNNER_IMAGE:-kiln-runner-node:local}
      # Studio (ADR-012) is off unless this is 1.
      KILN_STUDIO: ${KILN_STUDIO:-0}
      # Studio Apps: the runner image plus the Next.js template with node_modules installed.
      KILN_STUDIO_IMAGE: ${KILN_STUDIO_IMAGE:-kiln-runner-studio:local}
      KILN_EGRESS_NETWORK: ${KILN_EGRESS_NETWORK:-kiln-egress}
      KILN_EGRESS_PROXY: http://kiln-egress-proxy:3128
      # Studio previews on <id>.<domain>: needs wildcard DNS and a wildcard certificate (see self-hosting.md).
      KILN_STUDIO_PREVIEW_DOMAIN: ${KILN_STUDIO_PREVIEW_DOMAIN:-}
      # Studio sandboxes also join the preview network, where the API reaches their dev servers. The API
      # drops every connection and egress-log datagram that comes from its subnet.
      KILN_PREVIEW_NETWORK: ${KILN_PREVIEW_NETWORK:-kiln-preview}
      KILN_PREVIEW_SUBNET: ${KILN_PREVIEW_SUBNET:-172.30.250.0/24}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      # Decisions (command guard, triage, review risk): Jev when JEV_API_KEY is set (JEV_API_URL defaults to
      # https://api.typesafe.ai), then the LLM gateway, else Claude Haiku with ANTHROPIC_API_KEY.
      JEV_API_URL: ${JEV_API_URL:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      KILN_DECISION_MODEL: ${KILN_DECISION_MODEL:-}
      KILN_SMTP_URL: ${KILN_SMTP_URL:-}
      # OpenTelemetry (traces, metrics, logs over OTLP/HTTP); empty endpoint means off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kiln-api}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=prod}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    volumes:
      - kiln-data:/data
      # Sandboxes are sibling containers. Access to this socket is root on the host: run Kiln on a host you trust it with.
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ["4000"]
    # On the preview network too, so the Studio preview proxy reaches the sandboxes' dev servers.
    networks: [default, preview]
    depends_on:
      runner-image: { condition: service_started }
      runner-studio-image: { condition: service_started }
    # Checked every 2s so a deploy's restart gap is seconds, not the default 10s+ before the first check.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 15
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    init: true
    restart: unless-stopped
    environment:
      KILN_API_URL: http://api:4000
      KILN_PUBLIC_URL: ${KILN_PUBLIC_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: kiln-web
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=prod}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    expose: ["3000"]
    # Starts alongside the API (not after it is healthy) so the two restarts overlap during a deploy.
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 15
  # Builds the sandbox image (Node, git, Playwright and the agent CLIs) on this host; it only idles.
  runner-image:
    build: runners/images/node
    image: ${KILN_RUNNER_IMAGE:-kiln-runner-node:local}
    command: ["sleep", "infinity"]
    init: true
    stop_grace_period: 2s
    restart: unless-stopped
    network_mode: none
  # Builds Studio's sandbox image: the runner image plus the Next.js template from templates/nextjs,
  # with node_modules and a warm pnpm store, so a new App is a copy (runners/images/studio). It only idles.
  runner-studio-image:
    build:
      context: templates/nextjs
      dockerfile: ../../runners/images/studio/Dockerfile
      args: { BASE: "${KILN_RUNNER_IMAGE:-kiln-runner-node:local}" }
    image: ${KILN_STUDIO_IMAGE:-kiln-runner-studio:local}
    command: ["sleep", "infinity"]
    init: true
    stop_grace_period: 2s
    restart: unless-stopped
    network_mode: none
    depends_on:
      runner-image: { condition: service_started }
  # Sandboxes reach the internet only through this proxy, which enforces each run's allowlist.
  egress-proxy:
    build: deploy/egress-proxy
    init: true
    stop_grace_period: 5s
    restart: unless-stopped
    environment:
      KILN_EGRESS_ALLOW: ${KILN_EGRESS_ALLOW:-github.com,codeload.github.com,objects.githubusercontent.com,registry.npmjs.org,api.anthropic.com,api.openai.com,openrouter.ai}
      # Kiln's own host is added to the allowlist: agents reach the command guard and the Kiln MCP server there.
      KILN_PUBLIC_URL: ${KILN_PUBLIC_URL}
      # With OpenTelemetry on, the access log goes to the API (udp://api:5140), which sends it on as the
      # kiln-egress-proxy service. Decided in the entrypoint: Coolify cannot parse the ":+" form of interpolation.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Squid resolves the API's address once, so it restarts whenever a deploy replaces the API.
    depends_on:
      api: { condition: service_started, restart: true }
    networks:
      default: {}
      egress:
        aliases: [kiln-egress-proxy]
  # Not needed on Coolify (its proxy serves the domains). Elsewhere: HTTPS for both domains with --profile proxy.
  caddy:
    image: caddy:2.10-alpine
    profiles: [proxy]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "printf '%s {\\n  reverse_proxy web:3000\\n}\\n%s {\\n  reverse_proxy api:4000\\n}\\n' \"$${KILN_WEB_URL#*://}\" \"$${KILN_PUBLIC_URL#*://}\" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile"]
    environment:
      KILN_WEB_URL: ${KILN_WEB_URL}
      KILN_PUBLIC_URL: ${KILN_PUBLIC_URL}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]
    depends_on: [web, api]
networks:
  egress:
    name: ${KILN_EGRESS_NETWORK:-kiln-egress}
    internal: true
  # Only the API and Studio sandboxes; no internet, no egress proxy.
  preview:
    name: ${KILN_PREVIEW_NETWORK:-kiln-preview}
    internal: true
    ipam: { config: [{ subnet: "${KILN_PREVIEW_SUBNET:-172.30.250.0/24}" }] }
volumes:
  kiln-data:
  caddy-data:
