# Self-hosted Kiln on one machine: control plane, web app and the sandbox egress proxy.
# Bring your own keys: put CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or provider API keys in .env.
name: kiln
services:
  api:
    build: .
    env_file: [.env]
    environment:
      KILN_PUBLIC_URL: ${KILN_PUBLIC_URL:-http://localhost:4000}
      KILN_WEB_URL: ${KILN_WEB_URL:-http://localhost:3000}
      KILN_SANDBOX: ${KILN_SANDBOX:-docker}
      # Studio previews: e.g. preview.localhost:4000 (browsers resolve *.localhost to this machine).
      KILN_STUDIO: ${KILN_STUDIO:-0}
      KILN_STUDIO_PREVIEW_DOMAIN: ${KILN_STUDIO_PREVIEW_DOMAIN:-}
      # Studio sandboxes also join kiln-preview, where the API reaches their dev servers. The API drops
      # every connection and egress-log datagram that comes from that subnet.
      KILN_PREVIEW_NETWORK: kiln-preview
      KILN_PREVIEW_SUBNET: ${KILN_PREVIEW_SUBNET:-172.30.250.0/24}
    networks: [default, kiln-preview]
    volumes:
      - kiln-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 6
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      KILN_API_URL: http://api:4000
      KILN_TOKEN: ${KILN_TOKEN:-}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
  egress-proxy:
    build: deploy/egress-proxy
    container_name: kiln-egress-proxy
    environment:
      KILN_EGRESS_ALLOW: ${KILN_EGRESS_ALLOW:-github.com,codeload.github.com,registry.npmjs.org,api.anthropic.com,api.openai.com}
    networks: [kiln-egress]
  # Optional: one OpenAI-compatible gateway for typed decisions and judges (Bedrock, Vertex or any provider behind it).
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.77.7-stable
    profiles: [gateway]
    command: ["--port", "4001"]
    env_file: [.env]
    ports: ["4001:4001"]
networks:
  kiln-egress:
    name: kiln-egress
    internal: true
  # Only the API and Studio sandboxes; no internet, no egress proxy.
  kiln-preview:
    name: kiln-preview
    internal: true
    ipam: { config: [{ subnet: "${KILN_PREVIEW_SUBNET:-172.30.250.0/24}" }] }
volumes:
  kiln-data:
