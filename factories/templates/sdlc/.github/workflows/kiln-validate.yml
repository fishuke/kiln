# Copy into your factory's config repo: every PR to the definition is validated before a person merges it.
name: kiln-validate
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: definition }
      - uses: actions/checkout@v4
        with: { repository: fishuke/kiln, path: kiln }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: kiln/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd kiln && pnpm install --frozen-lockfile && pnpm kiln validate ../definition
