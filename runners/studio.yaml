# Studio sandbox (ADR-012): the runner image with the Next.js template at /opt/kiln/templates/nextjs,
# its node_modules installed and the pnpm store warm. Build it with
#   docker build -t kiln-runner-studio:local -f runners/images/studio/Dockerfile templates/nextjs
description: Studio sandbox with the Next.js template and a warm pnpm store
image: kiln-runner-studio:local
backend: docker
shape: { vcpus: 2, memoryGb: 4 }
egress:
  - registry.npmjs.org
