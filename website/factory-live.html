<!doctype html>
<!--
  Kiln live factory: a never-ending simulation for the website (embedded in index.html).
  Work items arrive from GitHub, Linear, Slack, Jira and Sentry and run through pipelines/feature.yaml:
  triage → spec (gate) → build (fan_out) → verify (on_fail → build) → preview (gate) → review → main (a person merges).
  Hover an item to follow it, hover a machine to see its YAML, click a source tab to change what comes in.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln factory, live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0b; --card:#111113; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15); --text:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
    --ember:#ff7a1a; --ember2:#ffb347; --blue:#6aa3ff; --green:#4ade80; --red:#f87171; --mono:"JetBrains Mono", ui-monospace, monospace; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #panel { position:absolute; top:22px; right:22px; width:min(380px, 38%); display:flex; flex-direction:column; gap:10px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { font:500 12.5px Inter; padding:6px 11px; border-radius:9px; border:1px solid var(--line2); background:rgba(20,20,23,.85); color:var(--muted); cursor:pointer; user-select:none; transition:border-color .15s, color .15s; }
  .tab:hover { color:var(--text); }
  .tab.on { color:var(--text); border-color:rgba(255,122,26,.65); box-shadow:0 0 0 3px rgba(255,122,26,.08); }
  .tab.off { opacity:.45; text-decoration:line-through; }
  .card { border:1px solid rgba(255,122,26,.35); border-radius:14px; background:rgba(17,17,19,.94); padding:14px 16px; box-shadow:0 0 0 1px rgba(255,122,26,.06), 0 30px 70px -30px rgba(0,0,0,.9), 0 0 60px -30px rgba(255,122,26,.5); backdrop-filter:blur(6px); }
  .row { display:flex; align-items:center; gap:8px; }
  .src { font-weight:600; } .key { color:var(--dim); font:12px var(--mono); }
  .badge { margin-left:auto; font:600 11px var(--mono); padding:3px 8px; border-radius:7px; border:1px solid; white-space:nowrap; }
  .b-run { color:var(--ember2); border-color:rgba(255,179,71,.45); background:rgba(255,179,71,.08); }
  .b-you { color:var(--blue); border-color:rgba(106,163,255,.5); background:rgba(106,163,255,.1); }
  .b-ok { color:var(--green); border-color:rgba(74,222,128,.5); background:rgba(74,222,128,.08); }
  .b-bad { color:var(--red); border-color:rgba(248,113,113,.5); background:rgba(248,113,113,.08); }
  .title { font-size:16px; font-weight:600; margin:10px 0 2px; letter-spacing:-.01em; }
  .desc { color:var(--muted); font-size:13px; }
  .who { margin-top:12px; border-radius:10px; background:rgba(255,255,255,.04); padding:9px 12px; display:grid; gap:6px; font-size:13px; }
  .who div { display:flex; align-items:center; gap:8px; } .who span:last-child { margin-left:auto; color:var(--dim); font-size:12px; }
  .av { width:18px; height:18px; border-radius:50%; background:#3b5b9a; display:inline-block; }
  .kl { width:18px; height:18px; border-radius:5px; background:#fafafa; display:inline-grid; place-items:center; color:#111; font:800 10px Inter; letter-spacing:-1px; }
  .steps { display:flex; gap:4px; margin-top:12px; }
  .steps i { flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.08); }
  .steps i.done { background:var(--ember); } .steps i.now { background:var(--ember2); box-shadow:0 0 8px var(--ember); }
  .steps i.bad { background:var(--red); } .steps i.you { background:var(--blue); box-shadow:0 0 8px var(--blue); }
  .log { margin-top:10px; font:11.5px/1.6 var(--mono); color:var(--muted); min-height:56px; }
  .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log b { color:var(--ember2); font-weight:500; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { border:1px solid var(--line); border-radius:11px; padding:8px 10px; background:rgba(17,17,19,.85); }
  .stat b { display:block; font-size:20px; letter-spacing:-.02em; }
  .stat span { color:var(--dim); font-size:11.5px; }
  #tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .15s; border:1px solid var(--line2); border-radius:10px; background:rgba(13,13,15,.96); padding:9px 12px; font:12px/1.65 var(--mono); color:#d4d4d8; white-space:pre; box-shadow:0 20px 50px -20px rgba(0,0,0,.9); }
  #tip .k { color:#93c5fd; } #tip .c { color:var(--dim); } #tip .h { color:var(--ember2); font-family:Inter; font-weight:600; font-size:12.5px; }
  #hint { position:absolute; left:22px; bottom:16px; font:12px var(--mono); color:var(--dim); }
  @media (max-width: 760px) {
    #panel { top:auto; bottom:12px; left:12px; right:12px; width:auto; }
    .tabs, .stats, .who, .log, #hint { display:none; }
    .card { padding:10px 12px; } .title { font-size:14px; margin-top:6px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="tabs" id="tabs"></div>
  <div class="card" id="card"></div>
  <div class="stats"><div class="stat"><b id="sFlight">0</b><span>in flight</span></div><div class="stat"><b id="sYou">0</b><span>waiting for you</span></div><div class="stat"><b id="sMerged">0</b><span>merged by people</span></div></div>
</div>
<div id="tip"></div>
<div id="hint">hover a work item or a machine</div>

<script>
// ---------------------------------------------------------------- setup
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, S = 60, OX = 0, OY = 0;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const narrow = W < 760, area = narrow ? W : W * 0.64;
  S = Math.max(20, Math.min(area / (narrow ? 14.6 : 13.2), H / 5.6));
  OX = (narrow ? W * .04 : W * .03) + S * 1.1; OY = H * (narrow ? .40 : .62) - S * 1.55;
}
addEventListener("resize", resize); resize();
const iso = (x, y, z = 0) => [OX + (x - y) * .866 * S, OY + (x + y) * .5 * S - z * S];
const rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

// ---------------------------------------------------------------- the conveyor (a V with a rounded corner)
const PATH = (() => {
  const pts = [], L = 6.6, R = 1.3, step = .04;
  for (let x = -.4; x <= L - R; x += step) pts.push([x, 0]);
  for (let k = 0; k <= 1; k += .03) { const a = [L - R, 0], c = [L, 0], b = [L, -R]; const u = 1 - k; pts.push([u*u*a[0] + 2*u*k*c[0] + k*k*b[0], u*u*a[1] + 2*u*k*c[1] + k*k*b[1]]); }
  for (let y = -R; y >= -L - .5; y -= step) pts.push([L, y]);
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
})();
function at(s) {
  s = Math.max(0, Math.min(PATH.len, s));
  let lo = 0, hi = PATH.cum.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (PATH.cum[m] < s) lo = m; else hi = m; }
  const a = PATH.pts[lo], b = PATH.pts[hi], k = (s - PATH.cum[lo]) / ((PATH.cum[hi] - PATH.cum[lo]) || 1);
  const tx = b[0] - a[0], ty = b[1] - a[1], n = Math.hypot(tx, ty) || 1;
  return { x: a[0] + tx * k, y: a[1] + ty * k, tx: tx / n, ty: ty / n };
}

// ---------------------------------------------------------------- stations (pipelines/feature.yaml)
const ST = [
  { id: "intake",  s: .6, kind: "intake",  label: "intake",  yaml: ["# automations/*", "triggers: github, linear,", "  slack, jira, webhook"] },
  { id: "triage",  s: 2.0, kind: "scan",    label: "triage",  yaml: ["- id: triage", "  agent: triage"] },
  { id: "spec",    s: 3.4, kind: "doc",     label: "spec",    gate: true, yaml: ["- id: spec", "  agent: spec", "  gate: spec-approval   # you", "  skip_if: size in [xs, s]"] },
  { id: "build",   s: 4.6, kind: "build",   label: "build",   yaml: ["- id: build", "  agent: implement", "  fan_out: per_user_story"] },
  { id: "verify",  s: 8.55, kind: "arch",    label: "verify",  yaml: ["- id: verify", "  requires: [ci_green, videos]", "  on_fail: build   # max_loops: 3"] },
  { id: "preview", s: 9.85, kind: "screen",  label: "preview", gate: true, yaml: ["- id: preview", "  action: preview.deploy", "  gate: preview-acceptance   # you"] },
  { id: "review",  s: 11.1, kind: "scan",    label: "review",  yaml: ["- id: review", "  agent: review   # never merges"] },
  { id: "main",    s: 12.35, kind: "dock",   label: "main",    gate: true, yaml: ["- id: handoff", "  # a person merges. agents can't."] },
];
ST.forEach((st, i) => { st.i = i; const p = at(st.s); st.p = p; st.n = [p.ty, -p.tx]; st.busy = 0; st.flash = 0; });
const ORDER = ST.map((s) => s.id);

// ---------------------------------------------------------------- work items
const SOURCES = {
  GitHub: { color: "#e4e4e7", key: () => "#" + Math.floor(rnd(200, 990)) },
  Linear: { color: "#8b8bff", key: () => "PROD-" + Math.floor(rnd(10, 400)) },
  Slack:  { color: "#e8b4ff", key: () => "#support" },
  Jira:   { color: "#6aa3ff", key: () => "SHOP-" + Math.floor(rnd(100, 999)) },
  Sentry: { color: "#f87171", key: () => "fatal" },
};
const WORK = [
  ["Add date range filter to reports", "Filter reports by date range. Match the design system.", "m"],
  ["Saved carts for logged-in users", "Keep a cart for 30 days and restore it on login.", "m"],
  ["Fix Safari checkout button", "The pay button does nothing on Safari 18.", "s"],
  ["Typo on the pricing page", "“Anual” → “Annual”.", "xs"],
  ["CSV export for invoices", "Finance needs a monthly export with VAT columns.", "m"],
  ["TypeError in cart total", "Cannot read properties of undefined (reading 'price').", "s"],
  ["Rate limit header is wrong", "X-RateLimit-Remaining goes negative.", "s"],
  ["Dark mode for settings", "Respect the system theme on every settings tab.", "m"],
  ["Bump next 15 → 16", "Major upgrade broke the build. Migrate the code.", "m"],
  ["Patch lodash CVE-2026-1102", "High severity, reachable from the API.", "s"],
  ["Remove dead flag new_nav", "Fully rolled out for 41 days.", "xs"],
  ["Paginate the invoices API", "Customers with 10k+ invoices time out.", "m"],
  ["Flaky test: login redirect", "Passes and fails on the same commit.", "s"],
  ["Add audit log export", "Admins need a JSON export of the audit log.", "m"],
  ["Broken link in onboarding email", "Points to /setup instead of /start.", "xs"],
  ["Null pointer in webhook retry", "Retries crash when the payload is empty.", "s"],
];
let items = [], nextSpawn = 1, nextId = 1, merged = 0, focus = null, hover = null, spotlightAt = 0;
const enabled = new Set(Object.keys(SOURCES));
const PEOPLE = ["Priya", "Sam", "Alex", "Noor", "Jules"];

function spawn() {
  const srcs = [...enabled]; if (!srcs.length) return;
  const src = pick(srcs), w = pick(WORK);
  const it = { id: nextId++, src, key: SOURCES[src].key(), title: w[0], desc: w[1], size: w[2],
    s: -.3, stage: 0, state: "move", t0: 0, until: 0, loops: 0, z: 0, fly: null, log: [], born: now, failOnce: Math.random() < .3 && w[2] !== "xs" };
  addLog(it, `received from ${src}`);
  items.push(it);
  if (!focus || focus.state === "gone") focus = it;
}
function addLog(it, msg) { it.log.push(msg); if (it.log.length > 3) it.log.shift(); it.changed = now; }

const DWELL = { intake: [.5, .8], triage: [1.0, 1.6], spec: [1.0, 1.5], build: [2.2, 3.2], verify: [1.2, 1.7], preview: [1.0, 1.4], review: [1.1, 1.6], main: [.6, .9] };
const GATE = { spec: [1.2, 2.4], preview: [1.2, 2.2], main: [1.0, 1.8] };
const SPEED = 1.15;

function step(dt) {
  if (now >= nextSpawn) { if (items.filter((i) => i.state !== "gone").length < 7) spawn(); nextSpawn = now + rnd(2.2, 3.6); }
  // sort by progress so the one ahead is handled first
  const belt = items.filter((i) => i.state !== "gone").sort((a, b) => b.s - a.s);
  for (const it of belt) {
    const st = ST[it.stage];
    if (it.state === "move") {
      let target = st ? st.s : PATH.len + 1;
      // queue behind the item ahead (on the belt, not flying)
      const ahead = belt.filter((o) => o !== it && o.s > it.s && !o.fly && o.state !== "gone").sort((a, b) => a.s - b.s)[0];
      let limit = ahead ? ahead.s - .62 : Infinity;
      // a station busy with someone else holds the line
      if (st && st.busy && st.busy !== it.id) limit = Math.min(limit, st.s - .62);
      const ns = Math.min(it.s + SPEED * dt, target, limit);
      it.s = Math.max(it.s, ns);
      if (st && it.s >= st.s - .001 && (!st.busy || st.busy === it.id)) arrive(it, st);
    } else if (it.state === "dwell" && now >= it.until) leave(it, st);
    else if (it.state === "gate" && now >= it.until) { approve(it, st); }
    else if (it.fly) {
      const k = (now - it.fly.t0) / it.fly.dur;
      if (k >= 1) { it.s = it.fly.to; it.z = 0; const kind = it.fly.kind; it.fly = null;
        if (kind === "fail") { const b = ST[3]; it.stage = 3; if (!b.busy) arrive(it, b); else { it.state = "move"; } }
        else { it.state = "move"; }
      } else { it.s = it.fly.from + (it.fly.to - it.fly.from) * ease(k); it.z = Math.sin(Math.PI * k) * it.fly.h; }
    }
  }
  for (const st of ST) st.flash = Math.max(0, st.flash - dt * 1.5);
  items = items.filter((i) => i.state !== "gone" || now - i.goneAt < 1.2);
  if (focus && focus.state === "gone" && now - focus.goneAt > 1.4) focus = null;
  // spotlight: follow whatever just changed, unless the visitor is hovering
  if (!hover && now - spotlightAt > 3.4) {
    const live = items.filter((i) => i.state !== "gone");
    const pickOne = live.find((i) => i.state === "gate") || live.sort((a, b) => b.changed - a.changed)[0];
    if (pickOne) focus = pickOne; spotlightAt = now;
  }
}
function arrive(it, st) {
  it.s = st.s;
  if (st.id === "spec" && (it.size === "xs" || it.size === "s") && it.stage === 2) {
    // skip_if: size in [xs, s] → hop over the spec machine
    addLog(it, `skip_if: size ${it.size} → straight to build`);
    it.stage = 3; it.state = "fly"; it.fly = { kind: "skip", from: st.s, to: st.s + .8, t0: now, dur: .9, h: .9 }; return;
  }
  st.busy = it.id; it.state = "dwell"; const d = DWELL[st.id]; it.until = now + rnd(d[0], d[1]); it.t0 = now;
  const msg = { intake: "queued for triage", triage: `triage: size ${it.size.toUpperCase()}`, spec: "spec: writing acceptance criteria", build: it.loops ? "build: fixing the failed criterion" : "build: fan_out per user story",
    verify: "verify: tests + a video per criterion", preview: "preview: deploying", review: "review agent: reading the diff", main: "ready to merge" }[st.id];
  addLog(it, msg);
}
function leave(it, st) {
  if (st.id === "verify" && it.failOnce && it.loops < 1) {
    st.busy = 0; it.loops++; st.flash = 1;
    addLog(it, "✗ criterion 2 failed → on_fail: build");
    it.state = "fly"; it.bad = now; it.fly = { kind: "fail", from: st.s, to: ST[3].s, t0: now, dur: 1.6, h: 1.5 }; return;
  }
  if (GATE[st.id]) { it.state = "gate"; const g = GATE[st.id]; it.until = now + rnd(g[0], g[1]); it.gateAt = now;
    addLog(it, { spec: "waiting for you: approve the spec", preview: "waiting for you: accept the preview", main: "waiting for a person to merge" }[st.id]); return; }
  if (st.id === "verify") addLog(it, "✓ all criteria proven");
  if (st.id === "review") addLog(it, "✓ no blocking findings");
  next(it, st);
}
function approve(it, st) {
  const who = pick(PEOPLE); st.flash = 1;
  if (st.id === "main") { addLog(it, `✓ merged by ${who}`); merged++; st.busy = 0; it.state = "gone"; it.goneAt = now; it.mergedBy = who; return; }
  addLog(it, `✓ ${st.id === "spec" ? "spec approved" : "preview accepted"} by ${who}`);
  next(it, st);
}
function next(it, st) { st.busy = 0; it.stage++; it.state = "move"; }

// ---------------------------------------------------------------- drawing
const STROKE = "rgba(255,255,255,.30)", STROKE_DIM = "rgba(255,255,255,.12)";
function poly(ps, fill, stroke, lw = 1) { ctx.beginPath(); ps.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function box(x, y, w, d, h, z = 0, o = {}) {
  const x0 = x - w/2, x1 = x + w/2, y0 = y - d/2, y1 = y + d/2;
  const P = (a, b, c) => iso(a, b, c);
  const st = o.stroke ?? STROKE, lw = o.lw ?? 1;
  poly([P(x0,y1,z),P(x1,y1,z),P(x1,y1,z+h),P(x0,y1,z+h)], o.left ?? "#0e0e10", st, lw);
  poly([P(x1,y0,z),P(x1,y1,z),P(x1,y1,z+h),P(x1,y0,z+h)], o.right ?? "#121215", st, lw);
  poly([P(x0,y0,z+h),P(x1,y0,z+h),P(x1,y1,z+h),P(x0,y1,z+h)], o.top ?? "#17171b", st, lw);
}
function ellipse(x, y, r, z, stroke, lw = 1, dash = null, rot = 0) {
  ctx.save(); const [cx, cy] = iso(x, y, z); ctx.translate(cx, cy); ctx.scale(1, .5774); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, r * S * 1.22, 0, Math.PI * 2); ctx.restore();
  ctx.save(); if (dash) ctx.setLineDash(dash); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
}
function grid() {
  ctx.lineWidth = 1;
  for (let i = -4; i <= 14; i++) {
    const a = iso(i, -9), b = iso(i, 5), c = iso(-4, i - 9), d = iso(12, i - 9);
    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.moveTo(...c); ctx.lineTo(...d); ctx.stroke();
  }
  const g = ctx.createRadialGradient(W * .36, H * .5, Math.min(W, H) * .25, W * .36, H * .5, Math.max(W, H) * .75);
  g.addColorStop(0, "rgba(10,10,11,0)"); g.addColorStop(1, "rgba(10,10,11,1)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(...iso(5.5, -2), 10, ...iso(5.5, -2), S * 8); glow.addColorStop(0, "rgba(255,122,26,.10)"); glow.addColorStop(1, "rgba(255,122,26,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
}
function belt(t) {
  const half = .3, edge = (sgn) => PATH.pts.map((p, i) => { const q = PATH.pts[Math.min(i + 1, PATH.pts.length - 1)], r = PATH.pts[Math.max(i - 1, 0)]; let tx = q[0] - r[0], ty = q[1] - r[1]; const n = Math.hypot(tx, ty) || 1; tx /= n; ty /= n; return iso(p[0] + ty * half * sgn, p[1] - tx * half * sgn); });
  const L = edge(1), R = edge(-1);
  poly([...L, ...R.reverse()], "rgba(18,18,21,.95)", null);
  ctx.strokeStyle = STROKE; ctx.lineWidth = 1;
  for (const e of [L, R.reverse()]) { ctx.beginPath(); e.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke(); }
  // moving slats
  ctx.strokeStyle = "rgba(255,255,255,.10)";
  const off = reduced ? 0 : (t * SPEED * .9) % .28;
  for (let s = off; s < PATH.len; s += .28) { const p = at(s); const a = iso(p.x + p.ty * half, p.y - p.tx * half), b = iso(p.x - p.ty * half, p.y + p.tx * half); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); }
  // direction chevrons
  ctx.strokeStyle = "rgba(255,179,71,.35)"; ctx.lineWidth = 1.4;
  for (let s = 1.25; s < PATH.len; s += 2.6) { const p = at(s), c = iso(p.x, p.y), f = iso(p.x + p.tx * .14, p.y + p.ty * .14), l = iso(p.x - p.tx * .06 + p.ty * .12, p.y - p.ty * .06 - p.tx * .12), r = iso(p.x - p.tx * .06 - p.ty * .12, p.y - p.ty * .06 + p.tx * .12); ctx.beginPath(); ctx.moveTo(...l); ctx.lineTo(...f); ctx.lineTo(...r); ctx.stroke(); }
}
function station(st, t) {

// ---------------------------------------------------------------- panel
const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = ["All", ...Object.keys(SOURCES)].map((s) => `<span class="tab${s === "All" ? " on" : ""}" data-s="${s}">${s}</span>`).join("");
